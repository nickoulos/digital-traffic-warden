<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ψηφιακός Τροχονόμος — κέντρο ελέγχου</title>
<style>
:root{--sign:#0b3f91;--deep:#082f70;--night:#06245a;--white:#fff;--yellow:#ffd42a;--soft:#c5d5f1;--green:#2fd07c;--red:#ff5a4c;--ink:#17202b;--mute:#5a6675;--line:#dfe5ec}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
.boot *{transition:none!important}
html{font-size:10px;height:100%}
body{height:100%;background:var(--night);color:var(--white);overflow:hidden;display:flex;align-items:center;justify-content:center;
  font-family:Bahnschrift,"DIN Alternate","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:.3rem solid var(--yellow);outline-offset:.2rem}
.stage{position:relative;width:160rem;height:90rem;overflow:hidden;background:var(--deep)}
#map{position:absolute;left:0;top:0;width:100%;height:100%}

/* πινακίδα τίτλου και ρολόι */
.plate{position:absolute;left:2.4rem;top:2.2rem;background:var(--sign);border:.3rem solid var(--white);border-radius:1.6rem;padding:1.3rem 2rem 1.2rem;box-shadow:0 .6rem 2.4rem rgba(3,18,48,.45)}
.plate h1{font-size:2.9rem;font-weight:600;line-height:1}
.plate p{font-size:1.5rem;color:var(--yellow);margin-top:.45rem}
.clock{position:absolute;left:2.4rem;top:11.6rem;display:flex;align-items:baseline;gap:1.4rem}
.clock b{font-size:7.4rem;font-weight:600;line-height:.9}
.clock span{font-size:1.6rem;color:var(--soft);line-height:1.3}
.clock span i{font-style:normal;display:block;color:var(--yellow)}
.tally{position:absolute;left:2.4rem;top:21.4rem;width:33rem;background:rgba(6,36,90,.82);border-radius:1.2rem;padding:1.2rem 1.5rem}
.tally b{display:block;font-size:4.6rem;font-weight:600;line-height:1;color:var(--yellow)}
.tally b small{font-size:1.9rem;font-weight:400;margin-left:.5rem}
.tally span{display:block;font-size:1.4rem;color:var(--soft);line-height:1.3;margin-top:.3rem}
.legend{position:absolute;left:2.4rem;top:33.6rem;width:33rem;background:rgba(6,36,90,.82);border-radius:1.2rem;padding:1rem 1.5rem;font-size:1.3rem;line-height:1.9;color:var(--soft)}
.legend i{display:inline-block;width:1.1rem;height:1.1rem;border-radius:50%;margin-right:.6rem;vertical-align:-.05rem}
.legend i.big{width:1.7rem;height:1.7rem;border:.25rem solid var(--white);vertical-align:-.35rem;margin-right:.5rem}
.legend b{color:var(--white);font-weight:600}

/* φανάρια πάνω στον χάρτη */
.jn{position:absolute;transform:translate(-50%,-50%);z-index:3}
.jn .dot{display:block;width:3rem;height:3rem;border-radius:50%;border:.35rem solid var(--white);background:var(--green);transition:background-color 2.4s linear;box-shadow:0 .3rem 1rem rgba(3,18,48,.6)}
.jn.red .dot{animation:halo 1.3s ease-out infinite}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(255,90,76,.75)}100%{box-shadow:0 0 0 2.6rem rgba(255,90,76,0)}}
.jn .tag{position:absolute;left:2.4rem;top:-1.5rem;white-space:nowrap;background:var(--white);color:var(--ink);border-radius:.8rem;padding:.5rem .9rem .45rem;font-size:1.35rem;line-height:1.2;box-shadow:0 .3rem 1rem rgba(3,18,48,.45)}
.jn.left .tag{left:auto;right:2.4rem;text-align:right}
.jn.up .tag{left:-3rem;top:-6.6rem}
.jn.down .tag{left:-2rem;top:2.4rem}
.jn.rt .tag{left:2.4rem;top:-.4rem}
.jn .tag b{display:block;font-size:1.55rem;font-weight:600;color:var(--sign)}
.jn .tag em{font-style:normal;display:inline-block;margin-left:.6rem;background:var(--yellow);border-radius:.4rem;padding:0 .5rem;font-size:1.2rem}
.jn.sel .dot{outline:.3rem solid var(--yellow);outline-offset:.3rem}
.open .jn .tag{display:none}
.open .jn.sel,.open .jn.red,.open .jn:hover{z-index:8}
.open .jn.sel .tag,.open .jn.red .tag,.open .jn:hover .tag{display:block}
.jn.mini{z-index:2}
.jn.mini .dot{width:1.7rem;height:1.7rem;border-width:.25rem}
.jn.mini .tag{display:none;left:1.6rem;top:-5.4rem;z-index:8}
.jn.mini:hover,.jn.mini.sel,.jn.mini.red{z-index:8}
.jn.mini:hover .tag,.jn.mini.sel .tag,.jn.mini.red .tag{display:block}
.jn.mini.on .dot{border-color:var(--yellow)}
.jn.mini.add::after{content:"";position:absolute;left:50%;top:50%;width:.9rem;height:.9rem;margin:-2.1rem 0 0 .5rem;border-radius:50%;background:var(--yellow);border:.2rem solid var(--sign)}
/* κάρτα άξονα πάνω στον χάρτη */
.axc{position:absolute;z-index:3;width:31rem;background:var(--white);color:var(--ink);border-radius:1.2rem;padding:1rem 1.2rem 1.1rem;box-shadow:0 .4rem 1.6rem rgba(3,18,48,.5)}
.axc h3{font-size:1.75rem;font-weight:600;color:var(--sign);line-height:1.15}
.axc h3 span{display:block;font-size:1.3rem;font-weight:400;color:var(--mute)}
.axc .big{font-size:3.2rem;font-weight:600;line-height:1.05;color:var(--sign);margin-top:.3rem}
.axc .big small{font-size:1.4rem;font-weight:400;color:var(--mute);margin-left:.5rem}
.axc p{font-size:1.25rem;color:var(--mute);line-height:1.3;margin:.2rem 0 .5rem}
.axc label{display:block;font-size:1.25rem;color:var(--mute);margin-bottom:.25rem}
.axc .seg{display:flex}
.axc .seg button{flex:1;font-size:1.3rem;padding:.4rem .5rem}
.axc .go{display:block;width:100%;margin-top:.7rem;background:var(--sign);color:var(--white);border-radius:.8rem;padding:.6rem 1rem;font-size:1.45rem;font-weight:600}
.axc .go[aria-pressed=true]{background:var(--yellow);color:var(--ink)}
.axis button{font-size:1.25rem;font-weight:600;background:var(--yellow);color:var(--ink);border-radius:.5rem;padding:.1rem .8rem;margin-left:1rem}
.axis span{margin-left:auto}

/* ειδοποιήσεις */
.feed{position:absolute;left:2.4rem;bottom:11.4rem;width:44rem;display:flex;flex-direction:column-reverse;gap:.8rem;z-index:4}
.note{background:var(--white);color:var(--ink);border-radius:1rem;padding:.9rem 1.2rem .9rem 1.6rem;border-left:.8rem solid var(--yellow);font-size:1.45rem;line-height:1.3;box-shadow:0 .4rem 1.6rem rgba(3,18,48,.5);animation:in .35s ease both}
.note.alert{border-left-color:var(--red)}
.note.ok{border-left-color:var(--green)}
.note b{font-weight:600}
.note time{color:var(--mute);margin-right:.7rem}
.note button{display:inline-block;margin-top:.6rem;background:var(--sign);color:var(--white);border-radius:.7rem;padding:.5rem 1.1rem;font-size:1.4rem}
.note.ev{border-left-color:#2f8bff}
.note.old{opacity:.72}
.jn.pri .dot{outline:.4rem solid #2f8bff;outline-offset:.25rem}
.jn .tag em.p{background:#2f8bff;color:#fff}
.evm{position:absolute;z-index:4;width:3.4rem;height:3.4rem;margin:-1.7rem 0 0 -1.7rem;border-radius:.8rem;background:#fff;box-shadow:0 0 0 .4rem #2f8bff,0 .3rem 1.2rem rgba(3,18,48,.6);animation:siren .7s steps(2,jump-none) infinite}
.evm::before,.evm::after{content:"";position:absolute;background:#e0261b;border-radius:.15rem}
.evm::before{left:1.35rem;top:.6rem;width:.7rem;height:2.2rem}
.evm::after{left:.6rem;top:1.35rem;width:2.2rem;height:.7rem}
@keyframes siren{from{box-shadow:0 0 0 .4rem #2f8bff,0 .3rem 1.2rem rgba(3,18,48,.6)}to{box-shadow:0 0 0 .4rem #ff5a4c,0 .3rem 1.2rem rgba(3,18,48,.6)}}
.evbtn{position:absolute;left:2.4rem;top:47rem;width:33rem;z-index:4;background:#fff;color:#b3261e;border-radius:1.2rem;padding:1.1rem 1.5rem 1.1rem 5.6rem;text-align:left;font-size:1.9rem;font-weight:600;line-height:1.15;box-shadow:0 .4rem 1.6rem rgba(3,18,48,.5)}
.evbtn span{display:block;font-size:1.3rem;font-weight:400;color:#5a6675;margin-top:.2rem}
.evbtn::before,.evbtn::after{content:"";position:absolute;background:#e0261b;border-radius:.2rem}
.evbtn::before{left:2.55rem;top:1.5rem;width:.9rem;height:3rem}
.evbtn::after{left:1.5rem;top:2.55rem;width:3rem;height:.9rem}
.evmenu{position:absolute;left:2.4rem;top:54.6rem;width:33rem;z-index:7;background:#fff;color:#17202b;border-radius:1.2rem;padding:1.2rem;display:flex;flex-direction:column;gap:.6rem;box-shadow:0 .6rem 2.4rem rgba(3,18,48,.6)}
.evmenu p{font-size:1.35rem;color:#5a6675;margin-bottom:.2rem}
.evmenu button{text-align:left;font-size:1.55rem;padding:.7rem 1.1rem;border-radius:.8rem;background:#eef2f6;color:#0b3f91;font-weight:600}
.evmenu button:hover{background:#0b3f91;color:#fff}
@keyframes in{from{opacity:0;transform:translateY(1.2rem)}}

/* γραμμή χρόνου */
.time{position:absolute;left:2.4rem;right:2.4rem;bottom:1.8rem;height:8rem;background:rgba(6,36,90,.88);border-radius:1.2rem;padding:1rem 1.6rem;display:grid;grid-template-columns:auto 1fr auto;gap:1.8rem;align-items:center;z-index:4;transition:right .45s ease}
.time .ctl{display:flex;gap:.8rem;align-items:center}
.time .ctl button{height:4.4rem;min-width:4.4rem;padding:0 1.2rem;border:.2rem solid rgba(255,255,255,.5);border-radius:.9rem;font-size:1.6rem}
.time .ctl button[aria-pressed=true]{background:var(--white);color:var(--sign);border-color:var(--white)}
.track{position:relative;height:6rem;cursor:pointer}
.track svg{position:absolute;left:0;top:0;width:100%;height:4.2rem}
.track .hrs{position:absolute;left:0;right:0;bottom:0;height:1.6rem;font-size:1.2rem;color:var(--soft)}
.track .hrs i{position:absolute;font-style:normal;transform:translateX(-50%)}
.track .head{position:absolute;top:-.3rem;width:.3rem;height:4.8rem;background:var(--yellow);border-radius:.2rem;transform:translateX(-50%);pointer-events:none}
.time .cap{font-size:1.25rem;color:var(--soft);line-height:1.3;width:25rem}

/* πλαϊνή καρτέλα */
.tab{position:absolute;right:0;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;background:var(--white);color:var(--sign);font-size:1.7rem;font-weight:600;padding:2rem .9rem;border-radius:1.2rem 0 0 1.2rem;z-index:6;transition:right .45s ease;box-shadow:-.3rem 0 1.4rem rgba(3,18,48,.4)}
.panel{position:absolute;right:-56rem;top:0;width:56rem;height:100%;background:var(--white);color:var(--ink);z-index:5;transition:right .45s ease;padding:2rem 2.2rem 1.6rem;overflow-y:auto;box-shadow:-.6rem 0 2.4rem rgba(3,18,48,.45)}
.open .panel{right:0}
.open .tab{right:56rem}
.open .time{right:58.4rem}
.panel h2{font-size:2.6rem;font-weight:600;color:var(--sign);line-height:1.05}
.panel .lead{font-size:1.35rem;color:var(--mute);margin:.4rem 0 1rem;line-height:1.35}
.axis{font-size:1.5rem;font-weight:600;color:var(--white);background:var(--sign);border-radius:.7rem;padding:.45rem 1rem;margin:1.2rem 0 .2rem;display:flex;justify-content:space-between}
.axis span{font-weight:400;color:var(--soft)}
.jb{padding:1rem 0 1.1rem;border-bottom:.2rem solid var(--line)}
.jb.sel{background:#f3f6fa;margin:0 -1rem;padding-left:1rem;padding-right:1rem;border-radius:.8rem}
.jb .hd{display:flex;align-items:center;gap:1rem}
.jb .hd i{width:1.6rem;height:1.6rem;border-radius:50%;flex:none;transition:background-color 2.4s linear}
.jb .hd b{font-size:1.9rem;font-weight:600;flex:1;min-width:0}
.jb .hd .w{font-size:1.5rem;color:var(--mute)}
.seg{display:flex;border:.2rem solid var(--sign);border-radius:.8rem;overflow:hidden;flex:none}
.seg button{font-size:1.35rem;padding:.35rem .9rem;color:var(--sign)}
.seg button[aria-pressed=true]{background:var(--sign);color:var(--white)}
.jb .why{font-size:1.25rem;color:var(--mute);background:#eef2f6;border-radius:.6rem;padding:.3rem .8rem;flex:none}
.sig{display:grid;grid-template-columns:auto 1fr;gap:.5rem 1.2rem;align-items:center;margin-top:.8rem;font-size:1.35rem}
.lamps{display:flex;gap:.5rem;align-items:center}
.lamps u{text-decoration:none;display:inline-flex;align-items:center;gap:.45rem;margin-right:.8rem}
.lamps u i{width:1.5rem;height:1.5rem;border-radius:50%;background:#c9d2dc}
.lamps u i.g{background:var(--green)}
.lamps u i.r{background:var(--red)}
.lamps u i.a{background:#ffb400}
.rib{height:1.5rem;border-radius:.4rem;background:#c9d2dc}
.tm{display:grid;grid-template-columns:repeat(3,1fr) ;gap:.8rem;margin-top:.7rem}
.tm div{background:#f3f6fa;border-radius:.7rem;padding:.5rem .8rem}
.tm div b{display:block;font-size:2rem;font-weight:600;color:var(--sign);line-height:1.1}
.tm div b small{font-size:1.2rem;font-weight:400;color:var(--mute);margin-left:.4rem}
.tm div span{font-size:1.2rem;color:var(--mute)}
.ap{display:grid;grid-template-columns:1fr 7rem 5.4rem 9rem;gap:.8rem;align-items:center;font-size:1.3rem;padding:.22rem 0}
.ap.h{color:var(--mute);font-size:1.15rem;margin-top:.6rem}
.ap .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap .v{text-align:right;font-weight:600}
.ap .est{font-weight:400;color:#7a8696}
.ap .q{height:1.1rem;border-radius:.3rem;background:#e6ebf1;overflow:hidden}
.ap .q i{display:block;height:100%;background:var(--sign);border-radius:.3rem;transition:width .4s linear}
.fine{position:absolute;left:auto;width:62rem;top:2.2rem;right:5rem;font-size:1.25rem;color:var(--soft);line-height:1.35;text-align:right;z-index:2;transition:right .45s ease;text-shadow:0 0 .6rem var(--deep)}
.open .fine{right:58.5rem}
@media (prefers-reduced-motion:reduce){.jn.red .dot{animation:none}.note{animation:none}.evm{animation:none}}
</style>
</head>
<body>
<div class="stage boot" id="stage">
  <canvas id="map"></canvas>
  <!-- Μετρήσεις ανιχνευτών: πραγματικές (ανοιχτά δεδομένα data.gov.gr), Τρίτη 3/11/2026, σε αναπαραγωγή. Αναμονή και αποτέλεσμα των αλλαγών: προσομοίωση.
       «Ρολόι»: σταθερό πρόγραμμα δικού μας σχεδιασμού, όχι το ισχύον. Λ. Βασ. Σοφίας: η κίνηση στις κάθετες χωρίς ανιχνευτή είναι παραδοχή. Δρόμοι και θέσεις φαναριών © OpenStreetMap. -->
  <div class="plate"><h1>Ψηφιακός Τροχονόμος</h1><p>Κέντρο ελέγχου σηματοδότησης</p></div>
  <div class="clock"><b id="clock">--:--</b><span>Τρίτη 3 Νοεμβρίου 2026<i id="mode">αναπαραγωγή ×60</i></span></div>
  <div class="tally"><b id="saved">0,0<small>ώρες</small></b><span id="savedCap">αναμονής λιγότερες</span></div>
  <div class="legend"><b>Ανιχνευτές</b><br><i style="background:#2fd07c"></i>κανονική <i style="background:#ffd42a;margin-left:1rem"></i>αργή <i style="background:#ff5a4c;margin-left:1rem"></i>πολύ αργή<br><i class="big" style="background:#2fd07c"></i><b>Φανάρι</b><br><i style="background:#ffd42a;width:2.4rem;height:.5rem;border-radius:.25rem;vertical-align:.25rem"></i>ίδιος άξονας <i style="background:none;border:.2rem solid #c5d5f1;margin-left:1rem"></i>εκτός ελέγχου</div>
  <div id="marks"></div>
  <div class="axc" id="axc">
    <h3>Λ. Βασ. Σοφίας<span id="axcN"></span></h3>
    <div class="big" id="axcH">0,0<small>ώρες αναμονής λιγότερες</small></div>
    <p id="axcP"></p>
    <label>Ανιχνευτές σε κάθετες</label>
    <div class="seg" id="axcDet"><button data-all="0">σημερινοί</button><button data-all="1">+11 νέοι</button></div>
    <button class="go" id="axcGo" aria-pressed="false"></button>
  </div>
  <div id="evs"></div>
  <button class="evbtn" id="evb" aria-expanded="false">Όχημα έκτακτης ανάγκης<span>προτεραιότητα σε διαδρομή</span></button>
  <div class="evmenu" id="evmenu" hidden></div>
  <div class="feed" id="feed" aria-live="polite"></div>
  <div class="time">
    <div class="ctl"><button id="play" aria-label="Αναπαραγωγή ή παύση">❚❚</button><button id="slow" aria-label="Πιο αργά">−</button><button id="fast" aria-label="Πιο γρήγορα">+</button><button id="auto" aria-pressed="false">Αυτόματη ανάθεση</button></div>
    <div class="track" id="track"><svg id="cong" viewBox="0 0 1000 100" preserveAspectRatio="none"></svg><div class="hrs" id="hrs"></div><div class="head" id="head"></div></div>
  </div>
  <button class="tab" id="tab" aria-expanded="false">Φανάρια και χρόνοι</button>
  <aside class="panel" id="panel" aria-label="Φανάρια και χρόνοι"></aside>
</div>
<script src="data.js"></script>
<script src="sim-core.js"></script>
<script src="map-data.js"></script>
<script src="corridor-data.js"></script>
<script src="sofias-data.js"></script>
<script src="signals-data.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var DAY = '2026-11-03', T0 = 6 * 3600, T1 = 22 * 3600, WIN = 300, RED = 40, CLEAR = 22;
  var H = {}; location.hash.slice(1).split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) H[p[0]] = p[1] == null ? '1' : p[1]; });
  function hms(s) { var p = String(s).split(':'); return (+p[0]) * 3600 + (+(p[1] || 0)) * 60; }
  var START = H.t ? hms(H.t) : 9 * 3600 + 30 * 60, speed = +H.speed || 60, playing = H.play !== '0', auto = H.auto === '1';
  var remPx = 10;
  function fit() { remPx = Math.min(innerWidth / 160, innerHeight / 90); document.documentElement.style.fontSize = remPx + 'px'; sizeMap(); }
  function hm(sec) { var h = Math.floor(sec / 3600) % 24, m = Math.floor(sec % 3600 / 60); return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
  function num(x, d) { return x.toFixed(d == null ? 1 : d).replace('.', ',').replace('-', '−'); }
  function mix(a, b, k) { return [0, 1, 2].map(function (i) { return Math.round(a[i] + (b[i] - a[i]) * k); }); }
  var GREEN = [47, 208, 124], YEL = [255, 212, 42], REDC = [255, 90, 76];
  function heat(w) { var c = w <= 15 ? GREEN : w <= 35 ? mix(GREEN, YEL, (w - 15) / 20) : w <= 55 ? mix(YEL, REDC, (w - 35) / 20) : REDC; return 'rgb(' + c.join(',') + ')'; }

  /* ---------- προσομοίωση: ένα δίκτυο ανά σημείο, και ένα «σκιώδες» που μένει πάντα στο ρολόι ---------- */
  // Στην Κηφισίας ο ορίζοντας είναι 180 s αντί για 120: αδειάζει πιο γρήγορα μια ήδη μεγάλη ουρά (βλ. knowledge-base/results/experiment-frontier.md).
  // Η Κηφισίας × Πανόρμου δεν είναι μόνη της: μπαίνει ως άξονας μαζί με το γειτονικό φανάρι της Αρκαδίας, ώστε ό,τι αλλάζουμε στο ένα
  // να φαίνεται και στο άλλο (βλ. knowledge-base/results/experiment-neighbours.md).
  DATA.sites = DATA.sites.filter(function (s) { return s.id !== 'kif' && s.id !== 'iera'; }).concat(CORRIDOR.site);   // η Ιερά Οδός είναι έξω από την περιοχή του χάρτη
  for (var cd in CORRIDOR.detectors) DATA.detectors[cd] = CORRIDOR.detectors[cd];
  // Η Λ. Βασ. Σοφίας μπαίνει ολόκληρη, με τα 14 φανάρια της (βλ. knowledge-base/results/experiment-sofias.md). Εκεί ο Τροχονόμος τρέχει με τους απλούς κανόνες,
  // που σε άξονα μετρήθηκαν καλύτεροι από τη βελτιστοποίηση ανά κόμβο. detAll: «τι θα γινόταν με ανιχνευτή σε κάθε κάθετη» (11 νέοι).
  DATA.sites = DATA.sites.concat(SOFIAS.site);
  for (var sd in SOFIAS.detectors) DATA.detectors[sd] = SOFIAS.detectors[sd];
  var detAll = H.det === 'all';
  function simFor(id) { return id === 'sofias' ? SimCore.createSim(DATA, id, DAY, T0, T1, { seed: 7, blind: detAll ? 0 : 1 }, 'adaptive', null) : SimCore.createSim(DATA, id, DAY, T0, T1, id === 'kifx' ? { seed: 7, optH: 180 } : { seed: 7 }, 'optimal', null); }
  var sites = [], J = [];           // J: όλα τα φανάρια
  function build() {

          (o.can ? '<div class="seg"><button data-key="' + o.key + '" data-on="0" aria-pressed="' + !o.on + '">Ρολόι</button><button data-key="' + o.key + '" data-on="1" aria-pressed="' + o.on + '">Τροχονόμος</button></div>' : '<span class="why">χωρίς ανιχνευτή στην κάθετη</span>') + '</div>' +
          '<div class="sig"><div class="lamps"><u><i class="' + lamp(o, 0) + '"></i>κύρια</u><u><i class="' + lamp(o, 1) + '"></i>κάθετη</u></div><div class="rib" style="background:' + ribbon(o, t) + '"></div></div>' +
          '<div class="tm"><div><b>' + (o.last[0] && o.last[1] ? C : p.C) + '<small>s</small></b><span>κύκλος · ρολόι ' + p.C + '</span></div><div><b>' + (o.last[0] || p.g0) + '<small>s</small></b><span>πράσινο κύριας · ρολόι ' + p.g0 + '</span></div><div><b>' + (o.last[1] || p.g1) + '<small>s</small></b><span>πράσινο κάθετης · ρολόι ' + p.g1 + '</span></div></div>' +
          '<div class="ap h"><span>Πρόσβαση</span><span class="v">οχ./ώρα</span><span class="v">ουρά</span><span></span></div>';
        net.juncs[o.j].apps.forEach(function (a) {
          var A = net.apps[a], f = Math.round(SimCore.flowAt(DATA, A, DAY, t, site.sim.P)), q = site.sim.qlen(a);
          html += '<div class="ap"><span class="n">' + A.label + '</span><span class="v' + (A.measured ? '' : ' est') + '">' + (A.measured ? '' : '≈') + f + '</span><span class="v">' + q + '</span><div class="q"><i style="width:' + Math.min(100, q * 2.5) + '%"></i></div></div>';
        });
        html += '</div>';
      });
    });
    var pn = $('panel'), sc = pn.scrollTop; pn.innerHTML = html; pn.scrollTop = sc;
  }
  $('panel').addEventListener('click', function (e) { var ax = e.target.getAttribute('data-axis'); if (ax) { sites.forEach(function (x) { if (x.id === ax) assignAxis(x, !axisOn(x), now()); }); return; } var k = e.target.getAttribute('data-key'); if (!k) return; J.forEach(function (o) { if (o.key === k) assign(o, e.target.getAttribute('data-on') === '1', now()); }); });

  /* ---------- γραμμή χρόνου ---------- */
  function timeline() {
    var pts = [], n = (T1 - T0) / 300, mx = 0, vals = [], near = MAP.dets.filter(function (d) { return d.lat > 37.969 && d.lat < 38.000 && d.lon > 23.728 && d.lon < 23.776; });
    for (var i = 0; i <= n; i++) { var b = Math.min(287, T0 / 300 + i), c = 0; near.forEach(function (d) { if (d.v[b] / d.ff < 0.6) c++; }); vals.push(c / near.length); mx = Math.max(mx, c / near.length); }
    vals.forEach(function (v, i) { pts.push((i / n * 1000).toFixed(1) + ',' + (96 - v / mx * 88).toFixed(1)); });
    $('cong').innerHTML = '<polygon points="0,100 ' + pts.join(' ') + ' 1000,100" fill="rgba(255,212,42,.25)"/><polyline points="' + pts.join(' ') + '" fill="none" stroke="#ffd42a" stroke-width="2" vector-effect="non-scaling-stroke"/>';
    var h = ''; for (var x = T0; x <= T1; x += 7200) h += '<i style="left:' + ((x - T0) / (T1 - T0) * 100) + '%">' + hm(x) + '</i>'; $('hrs').innerHTML = h;
  }
  $('track').addEventListener('click', function (e) { var r = $('track').getBoundingClientRect(), t = T0 + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (T1 - T0 - 60); goto(Math.round(t / 60) * 60); });

  /* ---------- χειρισμός ---------- */
  function ui() {
    $('play').textContent = playing ? '❚❚' : '▶'; $('auto').setAttribute('aria-pressed', auto);
    $('mode').textContent = (playing ? 'αναπαραγωγή ×' + speed : 'παύση') + (auto ? ', αυτόματη ανάθεση' : '');
  }
  $('play').addEventListener('click', function () { playing = !playing; ui(); });
  $('slow').addEventListener('click', function () { speed = Math.max(10, speed / 2); ui(); });
  $('fast').addEventListener('click', function () { speed = Math.min(480, speed * 2); ui(); });
  $('auto').addEventListener('click', function () { auto = !auto; ui(); });
  addEventListener('keydown', function (e) {
    if (e.key === ' ') { playing = !playing; e.preventDefault(); }
    else if (e.key === 'a' || e.key === 'A' || e.key === 'α' || e.key === 'Α') { var any = false; J.forEach(function (o) { if (o.red && o.can && !o.on) { assign(o, true, now()); any = true; } }); if (!any) auto = !auto; }
    else if (e.key === 'p' || e.key === 'P' || e.key === 'π' || e.key === 'Π') openPanel(!open);
    else if (e.key === 'e' || e.key === 'E' || e.key === 'ε' || e.key === 'Ε') dispatch(0);
    else if (e.key === 's' || e.key === 'S' || e.key === 'σ' || e.key === 'Σ') { var sf = sofias(); assignAxis(sf, !axisOn(sf), now()); }
    else if (e.key === 'd' || e.key === 'D' || e.key === 'δ' || e.key === 'Δ') setDet(!detAll);
    else if (e.key === 'r' || e.key === 'R' || e.key === 'ρ' || e.key === 'Ρ') { J.forEach(function (o) { o.on = false; }); goto(START); }
    else if (e.key === 'ArrowRight') speed = Math.min(480, speed * 2);
    else if (e.key === 'ArrowLeft') speed = Math.max(10, speed / 2);
    else return;
    ui();
  });

  /* ---------- βρόχος ---------- */
  var lastFrame = 0, carry = 0;
  function frame(ts) {
    var dt = lastFrame ? Math.min(0.1, (ts - lastFrame) / 1000) : 0; lastFrame = ts;
    if (playing && !sites[0].sim.done) { carry += dt * speed; var n = Math.min(600, Math.floor(carry)); carry -= n; for (var i = 0; i < n; i++) stepAll(false); }
    if (Math.abs(viewW - viewTarget) > 0.2) viewW += (viewTarget - viewW) * Math.min(1, dt * 7); else viewW = viewTarget;
    var t = now(); drawMap(t); marks(); axisCard(); evUpdate(t); drawPanel(false);
    $('clock').textContent = hm(t); $('head').style.left = ((t - T0) / (T1 - T0) * 100) + '%';
    var saved = 0, any = false; sites.forEach(function (s) { var a = 0, b = 0; s.sh.st.qInt.forEach(function (v) { a += v; }); s.sim.st.qInt.forEach(function (v) { b += v; }); saved += (a - b) / 3600; }); J.forEach(function (o) { if (o.on) any = true; });
    $('saved').firstChild.nodeValue = num(saved, Math.abs(saved) >= 100 ? 0 : 1);
    $('savedCap').textContent = any || Math.abs(saved) > 0.05 ? 'αναμονής λιγότερες, όλα τα φανάρια' : 'όλα τα φανάρια στο ρολόι';
    requestAnimationFrame(frame);
  }
  addEventListener('resize', fit);
  build(); fit(); timeline(); goto(START); if (H.panel === '1') openPanel(true);
  if (H.assign) { var at = hms(H.assign); while (now() < at) stepAll(false); J.forEach(function (o) { if (o.can && o.site.id === 'kifx') assign(o, true, now()); }); }
  if (H.sof) assignAxis(sofias(), true, now());
  if (H.ev != null) { dispatch(+H.ev); for (var w = 0; w < (+H.evrun || 75); w++) stepAll(false); }
  if (H.until) { var u = hms(H.until); while (now() < u) stepAll(false); }
  setTimeout(function () { $('stage').classList.remove('boot'); }, 300);
  if (H.debug) setTimeout(function () { var o = {}; ['stage', 'panel', 'tab', 'map'].forEach(function (k) { var r = $(k).getBoundingClientRect(); o[k] = [Math.round(r.left), Math.round(r.right), Math.round(r.width)]; }); o.win = [innerWidth, innerHeight, remPx, getComputedStyle($('panel')).right]; document.title = JSON.stringify(o); }, 1500);
  ui(); requestAnimationFrame(frame);
})();
</script>
</body>
